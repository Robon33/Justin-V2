  </g>
  <!-- silhouettes d'arbres -->
  <g fill="#7f716b" opacity="0.5">
    <ellipse cx="60" cy="220" rx="22" ry="34"/>
    <ellipse cx="540" cy="220" rx="22" ry="34"/>
    <ellipse cx="190" cy="232" rx="16" ry="24"/>
    <ellipse cx="410" cy="232" rx="16" ry="24"/>
